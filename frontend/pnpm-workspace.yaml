# pnpm-workspace.yaml configures dependency installation for the frontend package.
# Build permissions and version overrides keep native optional dependencies and
# shared transitive packages consistent with the test environment and checked lockfile.
# The package manager applies these rules before application checks run.
packages:
  - .

# esbuild and Vue compatibility hooks may build during installation. DOM tests
# provide Canvas substitutes, so the optional native canvas build stays disabled.
allowBuilds:
  esbuild: true
  vue-demi: true
  canvas: false

minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.71.1'
  - '@typescript-eslint/parser@8.71.1'
  - '@typescript-eslint/project-service@8.71.1'
  - '@typescript-eslint/scope-manager@8.71.1'
  - '@typescript-eslint/tsconfig-utils@8.71.1'
  - '@typescript-eslint/type-utils@8.71.1'
  - '@typescript-eslint/types@8.71.1'
  - '@typescript-eslint/typescript-estree@8.71.1'
  - '@typescript-eslint/utils@8.71.1'
  - '@typescript-eslint/visitor-keys@8.71.1'
  - postcss@8.5.29
  - typescript-eslint@8.71.1

overrides:
  # Vue compilation and localization share the configured source-map-js version
  # range; the lockfile records the concrete resolution used by both consumers.
  'source-map-js@<1.2.2': '>=1.2.2'
  'js-cookie': '3.0.7'
  'form-data@<4.0.6': '>=4.0.6'
  # Axios uses the Node redirect adapter during server-side tooling and tests.
  # Require the patch that corrects sensitive-header stripping across redirects.
  'follow-redirects@<1.16.1': '1.16.1'
  'nanoid': '3.3.18'
  'postcss@<8.5.18': '>=8.5.18'
  'dompurify@<3.4.17': '>=3.4.17'
  'postcss': '8.5.29'
  'ws@<8.21.0': '>=8.21.0'
